# IMPORTANT: this must exactly match the Worker project name shown in your
# Cloudflare dashboard (Workers & Pages -> your project). If you rename the
# project in the dashboard, update this to match, or the deploy will warn
# "Failed to match Worker name" and may deploy to the wrong script.
name = "snickylink-apk-v3-1"
compatibility_date = "2026-09-11"

# This configuration is for `wrangler deploy` (Workers static assets).
# For Cloudflare Pages, use: npm run cf:deploy
[assets]
directory = "./frontend/build/web"
not_found_handling = "single-page-application"

[vars]
# Set API_BASE_URL as a Cloudflare secret/environment variable when using
# a Worker deployment. The Flutter web build also accepts it at build time.
